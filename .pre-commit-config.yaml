# Pre-commit hooks for LNkernel.
# Install: uv tool install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: ^LICENSE$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Rust: rustfmt + clippy (workspace lives under crates/)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd crates && cargo fmt --all -- --check'
        language: system
        files: ^crates/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cd crates && cargo clippy --workspace --all-targets -- -D warnings'
        language: system
        files: ^crates/.*\.rs$
        pass_filenames: false

  # Markdown: deno fmt (config at deno.json)
  - repo: local
    hooks:
      - id: deno-fmt
        name: deno fmt (markdown)
        entry: deno fmt --check
        language: system
        files: ^(README\.md|MANIFESTO\.md|TCB\.md|COPYRIGHT)$
        pass_filenames: false

  # Secrets scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

# Skip slow hooks on commit, only run on push (lake build runs in CI only)
default_stages: [pre-commit]
fail_fast: false
